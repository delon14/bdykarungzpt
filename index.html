<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle MP4 - bdykarungzpt</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; background: #fafafa; }
    label { display: block; font-weight: 600; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
    #btnRemove4 { background-color: #d9534f; }
    #btnAdd4 { background-color: #28a745; }
    #btnClear { background-color: #6c757d; margin-top: 10px; width: 100%; padding: 6px; font-size: 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { margin-top: 16px; padding: 10px; background: #eee; border-radius: 4px; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="card">
  <h3>Toggle Ekstensi Video (delon14/bdykarungzpt)</h3>

  <label>GitHub Personal Access Token (Otomatis Tersimpan di Browser)</label>
  <input type="password" id="token" placeholder="ghp_iniTOKEN">
  <button id="btnClear" onclick="clearSavedToken()">Hapus Token Tersimpan dari Browser</button>

  <div class="btn-group">
    <button id="btnRemove4" onclick="renameViaGitTree('blackkarung/blackkarung.mp4', 'blackkarung/blackkarung.mp')">Hapus '4' (.mp)</button>
    <button id="btnAdd4" onclick="renameViaGitTree('blackkarung/blackkarung.mp', 'blackkarung/blackkarung.mp4')">Tambah '4' (.mp4)</button>
  </div>

  <div id="log">Status: Siap digunakan.</div>
</div>

<script>
  const OWNER = 'delon14';
  const REPO = 'bdykarungzpt';
  const BRANCH = 'main';
  const STORAGE_KEY = 'gh_token_bdykarungzpt';

  const tokenInput = document.getElementById('token');

  // Muat token otomatis saat halaman dibuka
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      tokenInput.value = saved;
      setLog('Status: Token dimuat otomatis dari browser.');
    }
  });

  // Simpan token otomatis saat diketik/ditempel
  tokenInput.addEventListener('input', () => {
    localStorage.setItem(STORAGE_KEY, tokenInput.value.trim());
  });

  function clearSavedToken() {
    localStorage.removeItem(STORAGE_KEY);
    tokenInput.value = '';
    setLog('Status: Token dihapus dari penyimpanan browser.');
  }

  function setLog(msg) {
    document.getElementById('log').textContent = msg;
  }

  function setButtonsDisabled(state) {
    document.getElementById('btnRemove4').disabled = state;
    document.getElementById('btnAdd4').disabled = state;
  }

  async function renameViaGitTree(oldPath, newPath) {
    const token = tokenInput.value.trim();
    if (!token) return setLog('Error: Masukkan GitHub Token terlebih dahulu!');

    localStorage.setItem(STORAGE_KEY, token);

    const headers = {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
    const baseUrl = `https://api.github.com/repos/${OWNER}/${REPO}`;

    setButtonsDisabled(true);
    setLog(`Memproses perubahan ke ${newPath}...`);

    try {
      // 1. Ambil commit terakhir di branch main
      const refRes = await fetch(`${baseUrl}/git/ref/heads/${BRANCH}`, { headers });
      if (!refRes.ok) throw new Error(`Gagal membaca branch (${refRes.status}). Cek apakah token masih aktif.`);
      const refData = await refRes.json();
      const latestCommitSha = refData.object.sha;

      // 2. Ambil tree SHA dari commit terakhir
      const commitRes = await fetch(`${baseUrl}/git/commits/${latestCommitSha}`, { headers });
      const commitData = await commitRes.json();
      const baseTreeSha = commitData.tree.sha;

      // 3. Cari SHA blob dari file lama
      const treeRes = await fetch(`${baseUrl}/git/trees/${baseTreeSha}?recursive=1`, { headers });
      const treeData = await treeRes.json();
      const targetItem = treeData.tree.find(item => item.path === oldPath);

      if (!targetItem) {
        throw new Error(`File "${oldPath}" tidak ditemukan di repositori.`);
      }

      // 4. Buat tree baru: tambahkan path baru dengan SHA blob yang sama, hapus path lama
      const newTreeRes = await fetch(`${baseUrl}/git/trees`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          base_tree: baseTreeSha,
          tree: [
            { path: newPath, mode: targetItem.mode, type: 'blob', sha: targetItem.sha },
            { path: oldPath, mode: targetItem.mode, type: 'blob', sha: null }
          ]
        })
      });
      if (!newTreeRes.ok) throw new Error(`Gagal membuat tree baru (${newTreeRes.status})`);
      const newTreeData = await newTreeRes.json();

      // 5. Buat commit baru
      const newCommitRes = await fetch(`${baseUrl}/git/commits`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          message: `Rename ${oldPath} -> ${newPath}`,
          tree: newTreeData.sha,
          parents: [latestCommitSha]
        })
      });
      const newCommitData = await newCommitRes.json();

      // 6. Arahkan branch main ke commit baru
      const updateRefRes = await fetch(`${baseUrl}/git/refs/heads/${BRANCH}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ sha: newCommitData.sha })
      });
      if (!updateRefRes.ok) throw new Error(`Gagal memperbarui branch (${updateRefRes.status})`);

      setLog(`Berhasil! File sekarang menjadi: ${newPath}`);
    } catch (err) {
      setLog(`Gagal: ${err.message}`);
    } finally {
      setButtonsDisabled(false);
    }
  }
</script>

</body>
</html>
